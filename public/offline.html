<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>trueHr</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #fafbfc;
      color: #0f172a;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .offline-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding-left: 16px;
      padding-right: 16px;
      padding-top: max(10px, env(safe-area-inset-top, 10px));
      padding-bottom: 10px;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      transform: translateY(-100%);
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease, background-color 0.2s ease;
    }

    .offline-banner.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .offline-banner.offline {
      background-color: #dc2626; /* Red 600 */
    }

    .offline-banner.online {
      background-color: #059669; /* Emerald 600 */
    }

    .banner-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .banner-icon.pulse {
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.92); }
    }

    /* Subtle centered brand placeholder (looks like app shell, not an error page) */
    .app-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    .logo-box {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      overflow: hidden;
      background: #db543e;
      box-shadow: 0 4px 12px rgba(219, 84, 62, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: breathe 3s ease-in-out infinite;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .brand-title span {
      color: #db543e;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.03); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Top Offline / Reconnected Banner (matches in-app OfflineBanner) -->
  <div class="offline-banner offline visible" id="offlineBanner" role="status" aria-live="polite">
    <svg class="banner-icon pulse" id="bannerIconOffline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
    <svg class="banner-icon" id="bannerIconOnline" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
      <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
    <span id="bannerText">You are offline. Please check your internet connection.</span>
  </div>

  <!-- Clean app shell placeholder (never looks like a separate error page) -->
  <div class="app-placeholder">
    <div class="logo-box">
      <img src="/assets/icons/logo.png" alt="trueHr" />
    </div>
    <div class="brand-title">true<span>HR</span></div>
  </div>

  <script>
    const APP_URL = "https://truehr.magicscale.in";
    const banner = document.getElementById("offlineBanner");
    const bannerText = document.getElementById("bannerText");
    const iconOffline = document.getElementById("bannerIconOffline");
    const iconOnline = document.getElementById("bannerIconOnline");

    let isReconnecting = false;

    function showOfflineState() {
      banner.className = "offline-banner offline visible";
      iconOffline.style.display = "block";
      iconOnline.style.display = "none";
      bannerText.textContent = "You are offline. Please check your internet connection.";
    }

    function showOnlineState() {
      banner.className = "offline-banner online visible";
      iconOffline.style.display = "none";
      iconOnline.style.display = "block";
      bannerText.textContent = "Back online! Reconnected to trueHr.";
    }

    async function pingCheck() {
      if (!navigator.onLine) return false;
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 2500);
        await fetch(APP_URL + "/favicon.ico?_t=" + Date.now(), {
          mode: "no-cors",
          cache: "no-store",
          signal: controller.signal
        });
        clearTimeout(timeout);
        return true;
      } catch (err) {
        return false;
      }
    }

    async function attemptReconnect() {
      if (isReconnecting) return;
      isReconnecting = true;

      const online = await pingCheck();
      if (online) {
        showOnlineState();
        setTimeout(() => {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.replace(APP_URL);
          }
        }, 350);
      } else {
        showOfflineState();
        isReconnecting = false;
      }
    }

    window.addEventListener("online", attemptReconnect);
    window.addEventListener("offline", showOfflineState);

    // Continuous silent check in background
    setInterval(() => {
      if (!isReconnecting && navigator.onLine) {
        attemptReconnect();
      }
    }, 2500);

    if (navigator.onLine) {
      setTimeout(attemptReconnect, 500);
    }
  </script>
</body>
</html>
