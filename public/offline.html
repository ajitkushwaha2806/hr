<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GetRepeat — No Internet Connection</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
    }

    .brand-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
    }
    
    .card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 32px 22px 24px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .icon-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #fff7ed;
      border: 1px solid #ffedd5;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 24px;
      border: 2px solid #ee694f;
      opacity: 0;
      animation: ripple 2s cubic-bezier(0.1, 0.2, 0.7, 1) infinite;
    }

    @keyframes ripple {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.25); opacity: 0; }
    }

    .icon-wrapper svg {
      width: 34px;
      height: 34px;
      color: #ee694f;
      stroke: #ee694f;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 9999px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 14px;
      transition: all 0.25s ease;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-badge.connecting {
      background: #fffbeb;
      border-color: #fde68a;
      color: #b45309;
    }

    .status-badge.online {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #16a34a;
    }

    h1 {
      font-size: 21px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.015em;
      margin-bottom: 8px;
    }

    p.description {
      font-size: 14px;
      line-height: 1.5;
      color: #64748b;
      margin-bottom: 24px;
      max-width: 320px;
    }

    /* Button */
    .btn-retry {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #ee694f, #f97316);
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow: 0 4px 14px rgba(238, 105, 79, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    }

    .btn-retry:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(238, 105, 79, 0.25);
    }

    .btn-retry:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .btn-retry.loading .spinner {
      display: inline-block;
    }

    .btn-retry.loading .btn-icon {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Checklist Card */
    .checklist-card {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 18px;
      text-align: left;
    }

    .checklist-title {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12.5px;
      color: #475569;
      margin-bottom: 6px;
    }

    .checklist-item:last-child {
      margin-bottom: 0;
    }

    .check-icon {
      width: 14px;
      height: 14px;
      color: #ee694f;
      stroke: #ee694f;
      stroke-width: 2.3;
      flex-shrink: 0;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>

  <script>
    const APP_URL = "https://hr-ten-lime.vercel.app";
    const retryBtn = document.getElementById("retryBtn");
    const btnText = document.getElementById("btnText");
    const statusBadge = document.getElementById("statusBadge");
    const statusText = document.getElementById("statusText");
    const iconWrapper = document.getElementById("iconWrapper");

    let isChecking = false;

    async function checkConnection() {
      if (!navigator.onLine) {
        return false;
      }
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);
        await fetch(APP_URL + "/favicon.ico?_t=" + Date.now(), {
          mode: "no-cors",
          cache: "no-store",
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return true;
      } catch (err) {
        return false;
      }
    }

    async function attemptReconnect() {
      if (isChecking) return;
      isChecking = true;

      retryBtn.classList.add("loading");
      retryBtn.disabled = true;
      btnText.textContent = "Connecting...";
      statusBadge.className = "status-badge connecting";
      statusText.textContent = "Checking connection...";

      const online = await checkConnection();

      if (online) {
        statusBadge.className = "status-badge online";
        statusText.textContent = "Connected! Loading app...";
        btnText.textContent = "Connected!";

        setTimeout(() => {
          window.location.replace(APP_URL);
        }, 250);
      } else {
        setTimeout(() => {
          retryBtn.classList.remove("loading");
          retryBtn.disabled = false;
          btnText.textContent = "Try Again";
          statusBadge.className = "status-badge";
          statusText.textContent = "Still Offline";

          iconWrapper.classList.add("shake");
          setTimeout(() => iconWrapper.classList.remove("shake"), 450);

          isChecking = false;
        }, 500);
      }
    }

    window.addEventListener("online", () => {
      attemptReconnect();
    });

    setInterval(() => {
      if (!isChecking && navigator.onLine) {
        checkConnection().then(online => {
          if (online) attemptReconnect();
        });
      }
    }, 4000);

    if (navigator.onLine) {
      setTimeout(attemptReconnect, 1000);
    }
  </script>
</body>
</html>
